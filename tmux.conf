unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# Quality of life settings
set -g mouse on                          # Enable mouse for scrolling/resizing
set -g default-terminal "screen-256color" # Better colors
set -s escape-time 10                    # Keep Escape responsive while recognizing Alt keys
set -g history-limit 10000               # More scrollback history
set -g base-index 1                      # Start windows at 1
setw -g pane-base-index 1                # Start panes at 1
set -g renumber-windows on               # Close gaps in window numbering
set -g focus-events on
set -g default-command "${SHELL}"        #Comment out in mac or non nixos
set -g allow-passthrough 
set -s set-clipboard on

# Copy to the native system clipboard (macOS, Wayland, or X11)
setw -g mode-keys vi
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set -g @copy-command "pbcopy"' \
  'if-shell '\''[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1'\'' \
    '\''set -g @copy-command "wl-copy"'\'' \
    '\''set -g @copy-command "xclip -in -selection clipboard"'\'''

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy-command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy-command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy-command}"

# Split panes using | and - (and stay in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind-key x kill-pane

# Move between panes with Prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + H/J/K/L (Shifted)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
